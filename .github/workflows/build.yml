name: Build (iOS)
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 (Liquid Glass)
        # Szkło z iOS 26 wymaga SDK iOS 26; bierzemy najnowszy Xcode 26, jeśli jest na maszynie.
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort | tail -n 1 || true)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; else echo "UWAGA: brak Xcode 26 – build bez Liquid Glass"; fi
          xcodebuild -version
      - name: Kompilacja dla iOS (bez podpisu)
        run: |
          cp Resources/Info.base.plist Resources/Info.plist
          xcodebuild -scheme WaybillRouter -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit ${PIPESTATUS[0]}
